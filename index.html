<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Scan Barang</title>

  <!-- Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- Supabase FIX -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: black;
      color: white;
      text-align: center;
    }

    #scanner-container {
      position: relative;
      width: 100%;
      height: 60vh;
      overflow: hidden;
    }

    #reader {
      width: 100%;
      height: 100%;
    }

    video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 260px;
      height: 140px;
      transform: translate(-50%, -50%);
      border: 3px solid white;
      border-radius: 10px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
    }

    button {
  width: 90%;
  max-width: 400px;
  height: 55px;
  margin: 10px auto;
  display: block;

  font-size: 18px;
  font-weight: bold;

  border-radius: 12px;
  border: none;

  background: linear-gradient(135deg, #2196F3, #1976D2);
  color: white;

  box-shadow: 0 4px 10px rgba(0,0,0,0.3);

  transition: all 0.2s ease;
}

/* efek ditekan */
button:active {
  transform: scale(0.97);
  box-shadow: 0 2px 5px rgba(0,0,0,0.4);
}

.btn-scan {
  background: linear-gradient(135deg, #4CAF50, #2E7D32);
}

.btn-switch {
  background: linear-gradient(135deg, #FF9800, #EF6C00);
}
    
    input {
      padding: 10px;
      margin: 5px;
      width: 90%;
      border-radius: 8px;
      border: none;
    }

    #hasil {
      margin: 10px;
      padding: 10px;
      background: #222;
      border-radius: 10px;
    }

    #status {
      margin: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<h2>📦 Scan Barang</h2>

<div id="scanner-container">
  <div id="reader"></div>
  <div class="overlay"></div>
</div>

<button class="btn-scan" onclick="startScanner()">▶️ Mulai Scan</button>
<button class="btn-switch" onclick="switchCamera()">🔄 Ganti Kamera</button>

<div id="status">🔄 Mengecek koneksi database...</div>
<div id="hasil">Siap scan...</div>

<div id="form" style="display:none;">
  <h3>Input Data</h3>
  <input type="text" id="barcode" readonly>
  <input type="text" id="nama" placeholder="Nama Barang">
  <input type="number" id="harga" placeholder="Harga">
  <button onclick="simpan()">💾 Simpan</button>
</div>

<script>
console.log("JS Loaded");

/* =========================
   🔥 KONFIGURASI SUPABASE
========================= */
const SUPABASE_URL = "https://sfdrqvkfdgioocpndigv.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmZHJxdmtmZGdpb29jcG5kaWd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMjI2NDAsImV4cCI6MjA5MDc5ODY0MH0.dOS8BVPW1YHpCjtcMZCVIVZxOZ2HPFn7HV3LF--wVkQ";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


/* =========================
   🔌 CEK KONEKSI
========================= */
async function cekKoneksi() {
  try {
    let { error } = await supabaseClient.from('produk').select('*').limit(1);

    if (error) throw error;

    document.getElementById("status").innerHTML = "🟢 Database terhubung";
    document.getElementById("status").style.color = "lightgreen";
  } catch (err) {
    document.getElementById("status").innerHTML = "🔴 Database tidak terhubung";
    document.getElementById("status").style.color = "red";
    console.error(err);
  }
}

cekKoneksi();


/* =========================
   📷 SCANNER
========================= */
let html5QrCode;
let cameras = [];
let currentCameraIndex = 0;
let isScanning = false;

function startScanner() {
  console.log("Start scanner clicked");

  if (html5QrCode) {
    html5QrCode.stop().catch(() => {});
  }

  html5QrCode = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices => {
    cameras = devices;

    if (!cameras.length) {
      alert("Kamera tidak ditemukan");
      return;
    }

    let backIndex = cameras.findIndex(cam =>
      cam.label.toLowerCase().includes('back') ||
      cam.label.toLowerCase().includes('rear') ||
      cam.label.toLowerCase().includes('environment')
    );

    currentCameraIndex = backIndex !== -1 ? backIndex : 0;

    startCamera(cameras[currentCameraIndex].id);
  }).catch(err => {
    alert("Error kamera: " + err);
  });
}

function startCamera(cameraId) {
  isScanning = true;

  html5QrCode.start(
    cameraId,
    {
      fps: 10,
      qrbox: { width: 260, height: 140 }
    },
    (decodedText) => {
      if (!isScanning) return;

      isScanning = false;

      document.getElementById("hasil").innerHTML = "⚡ Barcode terbaca...";

      new Audio("https://www.soundjay.com/button/beep-07.wav").play();

      html5QrCode.stop().then(() => {
        document.getElementById("reader").innerHTML = "";
      });

      document.getElementById("barcode").value = decodedText;

      cekData(decodedText);
    }
  );
}

function switchCamera() {
  if (!cameras.length || !html5QrCode) return;

  currentCameraIndex = (currentCameraIndex + 1) % cameras.length;

  html5QrCode.stop().then(() => {
    startCamera(cameras[currentCameraIndex].id);
  });
}


/* =========================
   🔍 CEK DATA
========================= */
async function cekData(barcode) {
  document.getElementById("hasil").innerHTML = "🔍 Mencari data...";

  try {
    let { data, error } = await supabaseClient
      .from('produk')
      .select('*')
      .eq('barcode', barcode)
      .order('tanggal', { ascending: true })
      .limit(5);

    if (error) throw error;

    if (data.length === 0) {
      document.getElementById("form").style.display = "block";
      document.getElementById("hasil").innerHTML = "❌ Data tidak ditemukan";
    } else {
      document.getElementById("form").style.display = "none";

      let html = "<h3>Riwayat Harga</h3>";

      data.forEach(d => {
        let tgl = new Date(d.tanggal).toLocaleDateString();
        html += `<p>${tgl} - Rp ${d.harga}</p>`;
      });

      document.getElementById("hasil").innerHTML = html;
    }
  } catch (err) {
    document.getElementById("hasil").innerHTML = "⚠️ Error koneksi database";
    console.error(err);
  }
}


/* =========================
   💾 SIMPAN DATA
========================= */
async function simpan() {
  try {
    let { error } = await supabaseClient.from('produk').insert([
      {
        barcode: document.getElementById("barcode").value,
        nama: document.getElementById("nama").value,
        harga: parseInt(document.getElementById("harga").value),
        tanggal: new Date()
      }
    ]);

    if (error) throw error;

    alert("✅ Data tersimpan");
    document.getElementById("form").style.display = "none";
    document.getElementById("hasil").innerHTML = "✅ Data berhasil ditambahkan";

  } catch (err) {
    alert("❌ Gagal simpan data");
    console.error(err);
  }
}
</script>

</body>
</html>
