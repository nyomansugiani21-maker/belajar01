<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Scan Harga Barang</title>

  <!-- Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, where, orderBy, limit } 
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC_Ua3MA1S7C1KjGkakKUEcNc0bUVFtHYo",
      authDomain: "belajar01-ed065.firebaseapp.com",
      projectId: "belajar01-ed065"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.fb = { collection, addDoc, getDocs, query, where, orderBy, limit };
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: black;
      color: white;
      text-align: center;
    }

    #scanner-container {
      position: relative;
      width: 100%;
      height: 60vh;
      overflow: hidden;
    }

    #reader {
      width: 100%;
      height: 100%;
    }

    video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 260px;
      height: 140px;
      transform: translate(-50%, -50%);
      border: 3px solid white;
      border-radius: 10px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
      pointer-events: none;
    }

    button {
      padding: 12px;
      margin: 5px;
      width: 90%;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    input {
      padding: 10px;
      margin: 5px;
      width: 90%;
      border-radius: 8px;
      border: none;
    }

    #hasil {
      margin: 10px;
      padding: 10px;
      background: #222;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h2>📦 Scan Barang</h2>

<div id="scanner-container">
  <div id="reader"></div>
  <div class="overlay"></div>
</div>

<button onclick="startScanner()">▶️ Mulai Scan</button>
<button onclick="switchCamera()">🔄 Ganti Kamera</button>

<div id="hasil">Siap scan...</div>

<div id="form" style="display:none;">
  <h3>Input Data</h3>
  <input type="text" id="barcode" readonly>
  <input type="text" id="nama" placeholder="Nama Barang">
  <input type="number" id="harga" placeholder="Harga">
  <button onclick="simpan()">💾 Simpan</button>
</div>

<script>
let html5QrCode;
let cameras = [];
let currentCameraIndex = 0;
let isScanning = false;


// START SCANNER
function startScanner() {
  if (html5QrCode) {
    html5QrCode.stop().catch(() => {});
  }

  html5QrCode = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices => {
    cameras = devices;

    if (!cameras.length) {
      alert("Kamera tidak ditemukan");
      return;
    }

    let backIndex = cameras.findIndex(cam =>
      cam.label.toLowerCase().includes('back') ||
      cam.label.toLowerCase().includes('rear') ||
      cam.label.toLowerCase().includes('environment')
    );

    currentCameraIndex = backIndex !== -1 ? backIndex : 0;

    startCamera(cameras[currentCameraIndex].id);
  });
}


// START CAMERA
function startCamera(cameraId) {
  isScanning = true;

  html5QrCode.start(
    cameraId,
    {
      fps: 10,
      qrbox: { width: 260, height: 140 }
    },
    (decodedText) => {
      if (!isScanning) return;

      isScanning = false;

      document.getElementById("hasil").innerHTML = "⚡ Barcode terbaca...";

      new Audio("https://www.soundjay.com/button/beep-07.wav").play();

      html5QrCode.stop().then(() => {
        document.getElementById("reader").innerHTML = "";
      });

      document.getElementById("barcode").value = decodedText;

      cekData(decodedText);
    }
  );
}


// SWITCH CAMERA
function switchCamera() {
  if (!cameras.length || !html5QrCode) return;

  currentCameraIndex = (currentCameraIndex + 1) % cameras.length;

  html5QrCode.stop().then(() => {
    startCamera(cameras[currentCameraIndex].id);
  });
}


// CEK DATA FIREBASE
async function cekData(barcode) {
  document.getElementById("hasil").innerHTML = "🔍 Mencari data...";

  const { collection, getDocs, query, where, orderBy, limit } = window.fb;
  const db = window.db;

  const q = query(
    collection(db, "produk"),
    where("barcode", "==", barcode),
    orderBy("tanggal", "asc"),
    limit(5)
  );

  const snapshot = await getDocs(q);

  if (snapshot.empty) {
    document.getElementById("form").style.display = "block";
    document.getElementById("hasil").innerHTML = "❌ Data tidak ditemukan";
  } else {
    document.getElementById("form").style.display = "none";

    let html = "<h3>Riwayat Harga</h3>";

    snapshot.forEach(doc => {
      let d = doc.data();
      let tgl = new Date(d.tanggal.seconds * 1000).toLocaleDateString();
      html += `<p>${tgl} - Rp ${d.harga}</p>`;
    });

    document.getElementById("hasil").innerHTML = html;
  }
}


// SIMPAN DATA FIREBASE
async function simpan() {
  const { collection, addDoc } = window.fb;
  const db = window.db;

  await addDoc(collection(db, "produk"), {
    barcode: document.getElementById("barcode").value,
    nama: document.getElementById("nama").value,
    harga: parseInt(document.getElementById("harga").value),
    tanggal: new Date()
  });

  alert("✅ Data tersimpan");
  document.getElementById("form").style.display = "none";
  document.getElementById("hasil").innerHTML = "✅ Data berhasil ditambahkan";
}
</script>

</body>
</html>
