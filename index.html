<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Scan Barang</title>

  <!-- Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- Supabase FIX -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #0f0f0f;
  color: white;
}

/* HEADER */
.header {
  padding: 15px;
  font-size: 20px;
  font-weight: bold;
  text-align: center;
}

/* SCANNER FULL */
#scanner-container {
  position: relative;
  width: 100%;
  height: 50vh;
  background: black;
}

.overlay {
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% { border-color: #00e676; }
  50% { border-color: #00c853; }
  100% { border-color: #00e676; }
}    

#reader {
  width: 100%;
  height: 100%;
}

video {
  width: 100% !important;
  height: 100% !important;
  object-fit: cover;
}

/* OVERLAY */
.overlay {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 280px;
  height: 160px;
  transform: translate(-50%, -50%);
  border: 3px solid #00e676;
  border-radius: 12px;
  box-shadow: 0 0 0 9999px rgba(0,0,0,0.6);
}

/* BUTTON AREA */
.controls {
  padding: 10px;
}

button {
  width: 100%;
  height: 60px;
  margin-top: 10px;
  border-radius: 14px;
  font-size: 18px;
  font-weight: bold;
  border: none;
}

/* BUTTON COLORS */
.btn-scan {
  background: linear-gradient(135deg, #00c853, #2e7d32);
}

.btn-switch {
  background: linear-gradient(135deg, #ff9800, #ef6c00);
}

/* STATUS */
#status {
  text-align: center;
  margin-top: 8px;
  font-size: 14px;
}

/* CARD */
.card {
  background: #1e1e1e;
  margin: 10px;
  padding: 15px;
  border-radius: 14px;
}

/* INPUT */
input {
  width: 100%;
  height: 50px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  padding: 10px;
  font-size: 16px;
}

/* HASIL */
#hasil {
  font-size: 16px;
  line-height: 1.6;
}
  </style>
</head>

<body>

<div class="header">📦 Scan Barang</div>

<div id="scanner-container">
  <div id="reader"></div>
  <div class="overlay"></div>
</div>

<div class="controls">
  <button class="btn-scan" onclick="startScanner()">▶️ Mulai Scan</button>
  <button class="btn-switch" onclick="switchCamera()">🔄 Ganti Kamera</button>

  <div id="status">🔄 Mengecek koneksi...</div>
</div>

<div class="card">
  <h3>📊 Hasil</h3>
  <div id="hasil">Siap scan...</div>
</div>

<div class="card" id="form" style="display:none;">
  <h3>📝 Input Data</h3>
  <input type="text" id="barcode" readonly>
  <input type="text" id="nama" placeholder="Nama Barang">
  <input type="number" id="harga" placeholder="Harga">
  <button class="btn-scan" onclick="simpan()">💾 Simpan</button>
</div>
  
<script>
console.log("JS Loaded");

/* =========================
   🔥 KONFIGURASI SUPABASE
========================= */
const SUPABASE_URL = "https://sfdrqvkfdgioocpndigv.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmZHJxdmtmZGdpb29jcG5kaWd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMjI2NDAsImV4cCI6MjA5MDc5ODY0MH0.dOS8BVPW1YHpCjtcMZCVIVZxOZ2HPFn7HV3LF--wVkQ";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


/* =========================
   🔌 CEK KONEKSI
========================= */
async function cekKoneksi() {
  try {
    let { error } = await supabaseClient.from('produk').select('*').limit(1);

    if (error) throw error;

    document.getElementById("status").innerHTML = "🟢 Database terhubung";
    document.getElementById("status").style.color = "lightgreen";
  } catch (err) {
    document.getElementById("status").innerHTML = "🔴 Database tidak terhubung";
    document.getElementById("status").style.color = "red";
    console.error(err);
  }
}

cekKoneksi();


/* =========================
   📷 SCANNER
========================= */
let html5QrCode;
let cameras = [];
let currentCameraIndex = 0;
let isScanning = false;

function startScanner() {
  console.log("Start scanner clicked");

  if (html5QrCode) {
    html5QrCode.stop().catch(() => {});
  }

  html5QrCode = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices => {
    cameras = devices;

    if (!cameras.length) {
      alert("Kamera tidak ditemukan");
      return;
    }

    let backIndex = cameras.findIndex(cam =>
      cam.label.toLowerCase().includes('back') ||
      cam.label.toLowerCase().includes('rear') ||
      cam.label.toLowerCase().includes('environment')
    );

    currentCameraIndex = backIndex !== -1 ? backIndex : 0;

    startCamera(cameras[currentCameraIndex].id);
  }).catch(err => {
    alert("Error kamera: " + err);
  });
}

function startCamera(cameraId) {
  isScanning = true;

  html5QrCode.start(
    cameraId,
    {
      fps: 10,
      qrbox: { width: 260, height: 140 }
    },
    (decodedText) => {
      if (!isScanning) return;

      isScanning = false;

      document.getElementById("hasil").innerHTML = "⚡ Barcode terbaca...";

      new Audio("https://www.soundjay.com/button/beep-07.wav").play();

      html5QrCode.stop().then(() => {
        document.getElementById("reader").innerHTML = "";
      });

      document.getElementById("barcode").value = decodedText;

      cekData(decodedText);
    }
  );
}

function switchCamera() {
  if (!cameras.length || !html5QrCode) return;

  currentCameraIndex = (currentCameraIndex + 1) % cameras.length;

  html5QrCode.stop().then(() => {
    startCamera(cameras[currentCameraIndex].id);
  });
}


/* =========================
   🔍 CEK DATA
========================= */
async function cekData(barcode) {
  document.getElementById("hasil").innerHTML = "🔍 Mencari data...";

  try {
    let { data, error } = await supabaseClient
      .from('produk')
      .select('*')
      .eq('barcode', barcode)
      .order('tanggal', { ascending: false })
      .limit(5);

    if (error) throw error;

    if (data.length === 0) {

  document.getElementById("form").style.display = "block";
  document.getElementById("hasil").innerHTML = "❌ Data tidak ditemukan. Silakan input data baru.";

} else {

  // 🔥 TAMPILKAN FORM (bukan disembunyikan)
  document.getElementById("form").style.display = "block";

  // 🔥 PREFILL NAMA BARANG dari data terakhir
  let lastData = data[data.length - 1];
  document.getElementById("nama").value = lastData.nama;

  // 🔥 FORMAT HARGA
  let html = "<h3>📊 Riwayat Harga</h3>";

  data.forEach(d => {
    let tgl = new Date(d.tanggal).toLocaleDateString();
    let hargaFormat = parseInt(d.harga).toLocaleString('id-ID');
    html += `<p>${tgl} - Rp ${hargaFormat}</p>`;
  });

  // 🔥 TAMBAHKAN PESAN UPDATE
  html += `
    <div style="
      margin-top:10px;
      padding:10px;
      background:#ff9800;
      border-radius:10px;
      font-size:14px;
    ">
      ⚠️ Harga bisa berubah. Silakan update harga terbaru.
    </div>
  `;

  document.getElementById("hasil").innerHTML = html;
}

      let html = "<h3>Riwayat Harga</h3>";

      data.forEach(d => {
        let tgl = new Date(d.tanggal).toLocaleDateString();
        let hargaFormat = parseInt(d.harga).toLocaleString('id-ID');
        html += `<p>${tgl} - Rp ${hargaFormat}</p>`;
      });

      document.getElementById("hasil").innerHTML = html;
    }
  } catch (err) {
    document.getElementById("hasil").innerHTML = "⚠️ Error koneksi database";
    console.error(err);
  }
}


/* =========================
   💾 SIMPAN DATA
========================= */
async function simpan() {
  try {
    let { error } = await supabaseClient.from('produk').insert([
      {
        barcode: document.getElementById("barcode").value,
        nama: document.getElementById("nama").value,
        harga: parseInt(document.getElementById("harga").value),
        tanggal: new Date()
      }
    ]);

    if (error) throw error;

    alert("✅ Data tersimpan");
    document.getElementById("form").style.display = "none";
    document.getElementById("hasil").innerHTML = "✅ Data berhasil ditambahkan";

  } catch (err) {
    alert("❌ Gagal simpan data");
    console.error(err);
  }
}
</script>

</body>
</html>
