<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Scan Barang</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: white;
    }

    .header {
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
    }

    #scanner-container {
      position: relative;
      width: 100%;
      height: 50vh;
      background: black;
    }

    #reader {
      width: 100%;
      height: 100%;
    }

    video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 280px;
      height: 160px;
      transform: translate(-50%, -50%);
      border: 3px solid #00e676;
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.6);
    }

    .controls {
      padding: 10px;
    }

    button {
      width: 100%;
      height: 60px;
      margin-top: 10px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      color: white;
    }

    .btn-scan {
      background: linear-gradient(135deg, #00c853, #2e7d32);
    }

    .btn-switch {
      background: linear-gradient(135deg, #ff9800, #ef6c00);
    }

    #status {
      text-align: center;
      margin-top: 8px;
      font-size: 14px;
    }

    .card {
      background: #1e1e1e;
      margin: 10px;
      padding: 15px;
      border-radius: 14px;
    }

    input {
      width: 100%;
      height: 50px;
      margin-top: 10px;
      border-radius: 10px;
      border: none;
      padding: 10px;
      font-size: 16px;
    }

    #hasil {
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<div class="header">📦 Scan Barang</div>

<div id="scanner-container">
  <div id="reader"></div>
  <div class="overlay"></div>
</div>

<div class="controls">
  <button class="btn-scan" onclick="startScanner()">▶️ Mulai Scan</button>
  <button class="btn-switch" onclick="switchCamera()">🔄 Ganti Kamera</button>
  <div id="status">🔄 Mengecek koneksi...</div>
</div>

<div class="card">
  <h3>📊 Riwayat Harga</h3>
  <div id="hasil">Siap scan...</div>
</div>

<div class="card" id="form" style="display:none;">
  <h3>📝 Input Harga Baru</h3>
  <input type="text" id="barcode" readonly>
  <input type="text" id="nama" placeholder="Nama Barang">
  <input type="number" id="harga" placeholder="Harga terbaru">
  <button class="btn-scan" onclick="simpan()">💾 Simpan</button>
</div>

<script>
console.log("App Loaded");

/* =========================
   🔥 SUPABASE CONFIG
========================= */
const SUPABASE_URL = "https://sfdrqvkfdgioocpndigv.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmZHJxdmtmZGdpb29jcG5kaWd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMjI2NDAsImV4cCI6MjA5MDc5ODY0MH0.dOS8BVPW1YHpCjtcMZCVIVZxOZ2HPFn7HV3LF--wVkQ";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


/* =========================
   🔌 CEK KONEKSI
========================= */
async function cekKoneksi() {
  let { error } = await supabaseClient.from('produk').select('*').limit(1);

  if (error) {
    document.getElementById("status").innerHTML = "🔴 Database tidak terhubung";
  } else {
    document.getElementById("status").innerHTML = "🟢 Database terhubung";
  }
}
cekKoneksi();


/* =========================
   📷 SCANNER
========================= */
let html5QrCode;
let cameras = [];
let currentCameraIndex = 0;
let isScanning = false;

function startScanner() {
  if (html5QrCode) {
    html5QrCode.stop().catch(()=>{});
  }

  html5QrCode = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices => {
    cameras = devices;

    let backIndex = devices.findIndex(d =>
      d.label.toLowerCase().includes("back") ||
      d.label.toLowerCase().includes("rear") ||
      d.label.toLowerCase().includes("environment")
    );

    currentCameraIndex = backIndex !== -1 ? backIndex : 0;

    startCamera(devices[currentCameraIndex].id);
  });
}

function startCamera(cameraId) {
  isScanning = true;

  html5QrCode.start(cameraId, {
    fps: 10,
    qrbox: { width: 280, height: 160 }
  }, (decodedText) => {

    if (!isScanning) return;
    isScanning = false;

    document.getElementById("hasil").innerHTML = "⚡ Barcode terbaca...";

    new Audio("https://www.soundjay.com/button/beep-07.wav").play();

    html5QrCode.stop();

    document.getElementById("barcode").value = decodedText;

    cekData(decodedText);
  });
}

function switchCamera() {
  if (!cameras.length) return;

  currentCameraIndex = (currentCameraIndex + 1) % cameras.length;

  html5QrCode.stop().then(() => {
    startCamera(cameras[currentCameraIndex].id);
  });
}


/* =========================
   🔍 CEK DATA
========================= */
async function cekData(barcode) {
  document.getElementById("hasil").innerHTML = "🔍 Mencari data...";

  let { data, error } = await supabaseClient
    .from('produk')
    .select('*')
    .eq('barcode', barcode)
    .order('tanggal', { ascending: false })
    .limit(5);

  if (error) {
    document.getElementById("hasil").innerHTML = "⚠️ Error database";
    return;
  }

  document.getElementById("form").style.display = "block";

  if (data.length === 0) {
    document.getElementById("hasil").innerHTML = "❌ Data tidak ditemukan";
    return;
  }

  let last = data[0];
  document.getElementById("nama").value = last.nama;

  let html = "<h3>📊 Riwayat Harga</h3>";

  data.forEach((d, i) => {
    let tgl = new Date(d.tanggal).toLocaleDateString();
    let harga = parseInt(d.harga).toLocaleString('id-ID');
    let label = i === 0 ? "🔥 Terbaru" : "";

    html += `<p>${tgl} - Rp ${harga} ${label}</p>`;
  });

  html += `
    <div style="margin-top:10px;padding:10px;background:#ff9800;border-radius:10px;">
      ⚠️ Harga bisa berubah, silakan input harga terbaru
    </div>
  `;

  document.getElementById("hasil").innerHTML = html;
}


/* =========================
   💾 SIMPAN DATA
========================= */
async function simpan() {
  await supabaseClient.from('produk').insert([{
    barcode: document.getElementById("barcode").value,
    nama: document.getElementById("nama").value,
    harga: parseInt(document.getElementById("harga").value),
    tanggal: new Date()
  }]);

  alert("✅ Data tersimpan");
}
</script>

<!-- SERVICE WORKER -->
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
